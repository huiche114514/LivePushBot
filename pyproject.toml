[project]
name = "main"
version = "0.1.0"
description = "main"
requires-python = ">=3.10, <4.0"
dependencies = [
    "pip>=26.2.2",
    "httpx>=0.28.1",
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot_plugin_apscheduler>=0.5.0",
    "nonebot-plugin-status>=0.9.0",
    "nonebot-plugin-wordcloud>=0.11.1",
    "nonebot-plugin-luoguluck>=0.3",
]

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-status = ["nonebot_plugin_status"]
nonebot-plugin-wordcloud = ["nonebot_plugin_wordcloud"]
nonebot-plugin-luoguluck = ["nonebot_plugin_luoguluck"]
